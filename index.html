<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --accent: #018574;
  --accent-dim: #015e52;
  --accent-ghost: rgba(1, 133, 116, 0.06);
  --accent-glow: rgba(1, 133, 116, 0.2);
  --accent-glow-strong: rgba(1, 133, 116, 0.35);
  --bg: #08090a;
  --bg-card: #0e1012;
  --bg-card-hover: #131618;
  --border: #1a1e21;
  --border-hover: #252b2f;
  --text-primary: #e8eaec;
  --text-secondary: #7a8088;
  --text-dim: #4a5058;
  --display: 'Chakra Petch', 'Syne Variable', sans-serif;
  --mono: 'IBM Plex Mono', 'LXGW WenKai Mono Variable', monospace;
}

html {
  scroll-behavior: smooth;
  overflow-x: hidden;
}

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
  -ms-overflow-style: none;
  scrollbar-width: none;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body::-webkit-scrollbar {
  display: none;
}

/* Noise overlay */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image: url("image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

/* Grid background */
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-image:
    linear-gradient(rgba(1,133,116,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(1,133,116,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: -1;
}

::selection {
  background: var(--accent);
  color: #fff;
}

a {
  color: var(--text-secondary);
  text-decoration: none;
  transition: color 0.25s ease;
}

a:hover {
  color: var(--accent);
}

/* ============================================================
   DECORATIVE ACCENT LINES — Circuit-board aesthetics
   ============================================================ */

/* Top-right diagonal line */
.deco-line-tr {
  position: fixed;
  top: 0;
  right: 120px;
  width: 1px;
  height: 200px;
  background: linear-gradient(to bottom, var(--accent), transparent);
  opacity: 0.12;
  transform: rotate(-15deg);
  transform-origin: top;
  z-index: -1;
}

/* Bottom-left horizontal accent */
.deco-line-bl {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 300px;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--accent), transparent);
  opacity: 0.08;
  z-index: -1;
}

/* Left vertical accent — connects header to content */
.deco-line-left {
  position: fixed;
  top: 35%;
  left: 0;
  width: 1px;
  height: 30%;
  background: linear-gradient(to bottom, transparent, var(--accent), transparent);
  opacity: 0.1;
  z-index: -1;
}

/* ============================================================
   LAYOUT
   ============================================================ */

.page {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 2.5rem;
  position: relative;
}

/* ============================================================
   HERO SECTION — Massive typographic treatment
   ============================================================ */

.hero {
  padding: 6rem 0 3rem;
  position: relative;
  overflow: hidden;
}

.hero-name {
  font-family: var(--display);
  font-size: clamp(2.5rem, 7vw, 5.5rem);
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.03em;
  color: var(--text-primary);
  position: relative;
  display: inline-block;
  cursor: default;
  user-select: none;
}

/* Glitch accent layer */
.hero-name::before {
  content: 'Yuer6327';
  position: absolute;
  top: 0;
  left: 0;
  color: var(--accent);
  opacity: 0;
  clip-path: inset(0 0 0 0);
  transition: opacity 0.3s ease;
  pointer-events: none;
  z-index: -1;
}

.hero-name:hover::before {
  opacity: 0.5;
  animation: glitch 0.4s ease forwards;
}

@keyframes glitch {
  0%   { transform: translate(0, 0); clip-path: inset(20% 0 60% 0); }
  20%  { transform: translate(-4px, 2px); clip-path: inset(50% 0 10% 0); }
  40%  { transform: translate(3px, -1px); clip-path: inset(10% 0 70% 0); }
  60%  { transform: translate(-2px, 3px); clip-path: inset(60% 0 20% 0); }
  80%  { transform: translate(4px, -2px); clip-path: inset(30% 0 40% 0); }
  100% { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
}

.hero-content {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 2rem;
  margin-top: 3rem;
}

.hero-left {
  flex: 1;
  min-width: 0;
}

.hero-tagline {
  font-size: 15px;
  color: var(--text-secondary);
  border-left: 2px solid var(--accent);
  padding-left: 1rem;
  margin-bottom: 2rem;
  font-style: italic;
  letter-spacing: 0.02em;
  opacity: 0;
  animation: fadeSlideFull 0.8s ease 0.3s forwards;
}

.hero-time {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  opacity: 0;
  animation: fadeSlideFull 0.8s ease 0.5s forwards;
}

.time-dot {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
  box-shadow: 0 0 6px var(--accent-glow-strong);
}

.hero-marker {
  font-size: 10px;
  color: var(--accent);
  opacity: 0.4;
  font-variant-numeric: tabular-nums;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  letter-spacing: 0.2em;
  white-space: nowrap;
  opacity: 0;
  animation: fadeSlideIn 0.8s ease 0.4s forwards;
}

/* ============================================================
   SECTION HEADERS — Minimal with accent line
   ============================================================ */

.section {
  margin-bottom: 3rem;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}

.section-title {
  font-family: var(--display);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.25em;
  color: var(--text-dim);
  white-space: nowrap;
}

.section-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
}

/* ============================================================
   LINK CARDS — 3-column grid with corner marks
   ============================================================ */

.links-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.link-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 1.4rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}

.link-card::after {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}

.link-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--accent-dim);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3), 0 0 0 1px var(--accent-dim);
  color: var(--text-primary);
}

.link-card:hover::after {
  opacity: 1;
}

/* Corner marks */
.link-card .corner {
  position: absolute;
  width: 8px;
  height: 8px;
  opacity: 0;
  transition: opacity 0.4s ease;
}

.link-card:hover .corner {
  opacity: 1;
}

.corner-tl { top: 6px; left: 6px; border-top: 1px solid var(--accent); border-left: 1px solid var(--accent); }
.corner-tr { top: 6px; right: 6px; border-top: 1px solid var(--accent); border-right: 1px solid var(--accent); }
.corner-bl { bottom: 6px; left: 6px; border-bottom: 1px solid var(--accent); border-left: 1px solid var(--accent); }
.corner-br { bottom: 6px; right: 6px; border-bottom: 1px solid var(--accent); border-right: 1px solid var(--accent); }

/* Icon container with rotating ring */
.link-icon {
  position: relative;
  width: 36px;
  height: 36px;
  flex-shrink: 0;
}

.link-icon-ring {
  position: absolute;
  inset: -3px;
  border: 1px solid var(--border);
  border-radius: 50%;
  transition: border-color 0.4s ease;
}

.link-card:hover .link-icon-ring {
  border-color: var(--accent-dim);
  animation: spin 8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.link-icon svg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 15px;
  height: 15px;
}

.link-icon svg path,
.link-icon svg rect,
.link-icon svg circle,
.link-icon svg polyline,
.link-icon svg polygon,
.link-icon svg line {
  transition: all 0.3s ease;
}

.link-card:hover .link-icon svg path[fill] { fill: var(--accent); }
.link-card:hover .link-icon svg path[stroke] { stroke: var(--accent); }
.link-card:hover .link-icon svg rect[stroke] { stroke: var(--accent); }
.link-card:hover .link-icon svg circle[stroke] { stroke: var(--accent); }
.link-card:hover .link-icon svg polyline[stroke] { stroke: var(--accent); }
.link-card:hover .link-icon svg line[stroke] { stroke: var(--accent); }

.link-text {
  min-width: 0;
  flex: 1;
}

.link-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 0.15rem;
  letter-spacing: 0.01em;
}

.link-url {
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}

.link-arrow {
  color: var(--text-dim);
  font-size: 14px;
  transition: all 0.3s ease;
  flex-shrink: 0;
}

.link-card:hover .link-arrow {
  color: var(--accent);
  transform: translateX(3px);
}

/* Copy badge — inline, after URL text */
.copy-badge {
  font-size: 9px;
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  padding: 0.15rem 0.5rem;
  opacity: 0;
  transform: translateX(4px);
  transition: all 0.3s ease;
  pointer-events: none;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
}

.copy-badge.show {
  opacity: 1;
  transform: translateX(0);
}

/* ============================================================
   PROJECT CARDS — 2x2 grid with rotating icon rings
   ============================================================ */

.projects-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.project-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.85rem;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  color: inherit;
}

.project-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  color: var(--text-primary);
}

/* Corner marks for project cards */
.project-card .corner {
  position: absolute;
  width: 6px;
  height: 6px;
  opacity: 0;
  transition: opacity 0.4s ease;
}

.project-card:hover .corner {
  opacity: 1;
}

/* Rotating accent ring */
.proj-icon {
  position: relative;
  width: 48px;
  height: 48px;
  flex-shrink: 0;
}

.proj-ring {
  position: absolute;
  inset: -4px;
  border: 1px solid var(--border);
  border-radius: 50%;
  transition: border-color 0.4s ease;
}

.project-card:hover .proj-ring {
  border-color: var(--accent);
  border-style: dashed;
  animation: spin 6s linear infinite;
}

/* Accent glow on hover */
.project-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, var(--accent-ghost) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}

.project-card:hover::before {
  opacity: 1;
}

.proj-icon svg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 16px;
  height: 16px;
}

.proj-icon svg path,
.proj-icon svg rect,
.proj-icon svg circle,
.proj-icon svg polyline,
.proj-icon svg polygon,
.proj-icon svg line {
  transition: all 0.3s ease;
}

.project-card:hover .proj-icon svg path[stroke] { stroke: var(--accent); }
.project-card:hover .proj-icon svg rect[stroke] { stroke: var(--accent); }
.project-card:hover .proj-icon svg circle[stroke] { stroke: var(--accent); }
.project-card:hover .proj-icon svg polyline[stroke] { stroke: var(--accent); }
.project-card:hover .proj-icon svg line[stroke] { stroke: var(--accent); }

.proj-text {
  min-width: 0;
}

.proj-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 0.2rem;
  letter-spacing: 0.02em;
}

.proj-url {
  font-size: 11px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}

.proj-arrow {
  position: absolute;
  top: 0.85rem;
  right: 0.85rem;
  color: var(--text-dim);
  font-size: 11px;
  transition: all 0.3s ease;
}

.project-card:hover .proj-arrow {
  color: var(--accent);
  transform: translate(2px, -2px);
}

/* ============================================================
   POSTS TIMELINE
   ============================================================ */

.timeline {
  position: relative;
  padding-left: 2.5rem;
}

.timeline::before {
  content: '';
  position: absolute;
  top: 0;
  left: 8px;
  width: 1px;
  height: 100%;
  background: repeating-linear-gradient(
    to bottom,
    var(--border) 0px,
    var(--border) 6px,
    transparent 6px,
    transparent 12px
  );
}

.timeline-item {
  position: relative;
  padding: 0.75rem 1.25rem;
  margin-bottom: 4px;
  background: var(--bg-card);
  border: 1px solid transparent;
  transition: all 0.3s ease;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: block;
}

.timeline-dot {
  position: absolute;
  left: -2.5rem;
  top: 1.25rem;
  width: 17px;
  height: 17px;
}

.timeline-dot::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 5px;
  height: 5px;
  background: var(--text-dim);
  border-radius: 50%;
  transition: all 0.3s ease;
}

.timeline-dot::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 11px;
  height: 11px;
  border: 1px solid transparent;
  border-radius: 50%;
  transition: all 0.3s ease;
}

.timeline-item:hover .timeline-dot::before {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow-strong);
}

.timeline-item:hover .timeline-dot::after {
  border-color: var(--accent-dim);
}

.timeline-item:hover {
  background: var(--bg-card-hover);
  border-color: var(--border);
  transform: translateX(4px);
}

.timeline-head {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.25rem;
}

.timeline-date {
  font-size: 10px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  letter-spacing: 0.04em;
}

.timeline-tag {
  font-size: 9px;
  color: var(--accent);
  border: 1px solid var(--accent-dim);
  padding: 0.1rem 0.5rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.timeline-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 0.2rem;
  transition: color 0.2s ease;
  letter-spacing: 0.01em;
}

.timeline-item:hover .timeline-title {
  color: var(--accent);
}

.timeline-excerpt {
  font-size: 11px;
  color: var(--text-dim);
  display: -webkit-box;
  -webkit-line-clamp: 1;
  line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
  letter-spacing: 0.02em;
}

/* Loading state */
.posts-loading {
  padding: 2rem;
  text-align: center;
  color: var(--text-dim);
  font-size: 11px;
  letter-spacing: 0.06em;
}

.loading-dots::after {
  content: '';
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

/* ============================================================
   FOOTER
   ============================================================ */

.footer {
  padding: 2rem 0 4rem;
  margin-top: 2rem;
}

.footer-line {
  width: 0;
  height: 1px;
  background: var(--border);
  margin-bottom: 2rem;
  transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
}

.footer-line.visible {
  width: 100%;
}

.footer-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}

.footer-left {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}

.footer-left a {
  color: var(--accent);
  transition: opacity 0.2s ease;
}

.footer-left a:hover {
  opacity: 0.7;
}

.footer-right {
  font-size: 11px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}

/* ============================================================
   ANIMATIONS
   ============================================================ */

@keyframes fadeSlideIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 0.7;
    transform: translateY(0);
  }
}

@keyframes fadeSlideFull {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Scroll-reveal */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

<script>
(function() {
  // ---- Time display ----
  function updateTime() {
    var now = new Date();
    var opts = { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hour12: false };
    var el = document.getElementById('current-time');
    if (el) el.textContent = now.toLocaleTimeString('zh-CN', opts);
  }
  updateTime();
  setInterval(updateTime, 30000);

  // ---- Footer time ----
  function updateFooterTime() {
    var now = new Date();
    var opts = { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false };
    var ftEl = document.getElementById('footer-time');
    if (ftEl) ftEl.textContent = 'UTC+8 ' + now.toLocaleString('zh-CN', opts);
  }
  updateFooterTime();
  setInterval(updateFooterTime, 30000);

  // ---- Scroll-reveal via IntersectionObserver ----
  var reveals = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var idx = 0;
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.style.transitionDelay = (idx++ * 0.15) + 's';
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    reveals.forEach(function(el) { observer.observe(el); });
  } else {
    reveals.forEach(function(el) { el.classList.add('visible'); });
  }

  // ---- Footer line self-drawing ----
  var footerLine = document.getElementById('footerLine');
  if (footerLine && 'IntersectionObserver' in window) {
    var footerObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          footerObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.5 });
    footerObserver.observe(footerLine);
  }

  // ---- Copy email ----
  window.copyEmail = function() {
    var email = 'Tom_2782587337@outlook.com';
    var badge = document.getElementById('copyBadge');
    var arrow = document.getElementById('emailArrow');

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(email).then(function() { showCopied(badge, arrow); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = email;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
      showCopied(badge, arrow);
    }
  };

  function showCopied(badge, arrow) {
    if (badge) {
      badge.classList.add('show');
      setTimeout(function() { badge.classList.remove('show'); }, 2000);
    }
    if (arrow) {
      var orig = arrow.textContent;
      arrow.textContent = '✓';
      arrow.style.color = '#018574';
      setTimeout(function() {
        arrow.textContent = orig;
        arrow.style.color = '';
      }, 2000);
    }
  }

  // ---- Escape HTML ----
  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---- Fetch RSS ----
  async function fetchPosts() {
    var container = document.getElementById('posts-list');
    try {
      var res = await fetch('https://blog.yuer6327.top/rss.xml');
      if (!res.ok) throw new Error('Network error');
      var xml = await res.text();
      var doc = new DOMParser().parseFromString(xml, 'application/xml');
      var items = doc.querySelectorAll('item');
      var posts = [];

      items.forEach(function(item) {
        var title = item.querySelector('title')?.textContent || '无标题';
        var link = item.querySelector('link')?.textContent || '#';
        var pubDate = item.querySelector('pubDate')?.textContent || '';
        var description = item.querySelector('description')?.textContent || '';
        var contentEl = item.getElementsByTagNameNS('http://purl.org/rss/1.0/modules/content/', 'encoded')[0];
        var content = contentEl ? (contentEl.textContent || '') : '';

        // Skip encrypted/password-protected posts
        if (!content || content.trim().length === 0) return;

        var dateStr = '';
        if (pubDate) {
          var d = new Date(pubDate);
          dateStr = d.getFullYear() + '-' +
            String(d.getMonth() + 1).padStart(2, '0') + '-' +
            String(d.getDate()).padStart(2, '0');
        }

        var cats = item.querySelectorAll('category');
        var tag = cats.length > 0 ? cats[0].textContent : '';

        posts.push({ title: title, link: link, dateStr: dateStr, description: description, tag: tag });
      });

      var display = posts.slice(0, 8);
      container.innerHTML = '';

      if (display.length === 0) {
        container.innerHTML = '<div class="posts-loading">暂无文章</div>';
        return;
      }

      display.forEach(function(post, i) {
        var el = document.createElement('a');
        el.href = post.link;
        el.target = '_blank';
        el.rel = 'noopener';
        el.className = 'timeline-item';
        el.style.opacity = '0';
        el.style.transform = 'translateX(-10px)';
        el.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        el.style.transitionDelay = (i * 0.08) + 's';

        var tagHtml = post.tag
          ? '<span class="timeline-tag">' + esc(post.tag) + '</span>'
          : '';

        el.innerHTML =
          '<div class="timeline-dot"></div>' +
          '<div class="timeline-head">' +
            '<span class="timeline-date">' + esc(post.dateStr) + '</span>' +
            tagHtml +
          '</div>' +
          '<div class="timeline-title">' + esc(post.title) + '</div>' +
          '<div class="timeline-excerpt">' + esc(post.description) + '</div>';

        container.appendChild(el);

        // Trigger animation after append
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            el.style.opacity = '1';
            el.style.transform = 'translateX(0)';
          });
        });
      });

    } catch (err) {
      container.innerHTML = '<div class="posts-loading">加载失败，请稍后重试</div>';
      console.error('RSS fetch error:', err);
    }
  }

  fetchPosts();
})();
</script>
