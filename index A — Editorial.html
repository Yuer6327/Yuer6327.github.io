<style>
/* ============================================================
   VERSION A — EDITORIAL QUIET LUXURY (DARK)
   引用：Kenya Hara (MUJI) × The New York Times
   主色：#018574  |  暗色调
   ============================================================ */

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --accent: #018574;
  --accent-soft: #064E43;
  --accent-ink: rgba(1, 133, 116, 0.12);

  --bg: #0E0D0B;
  --bg-tint: rgba(255, 255, 255, 0.02);

  --text-primary: #E8E2D4;
  --text-secondary: #8B8578;
  --text-dim: #5A5448;

  --border: rgba(232, 226, 212, 0.14);
  --border-strong: rgba(232, 226, 212, 0.22);

  --display: 'Noto Serif SC', 'Syne Variable', serif;
  --text: 'IBM Plex Mono', 'LXGW WenKai Mono Variable', monospace;

  --ease-decelerate: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-long: 700ms;
  --dur-mid: 300ms;
}

html {
  scroll-behavior: smooth;
  overflow-x: hidden;
}

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--text);
  font-size: 14px;
  line-height: 1.75;
  min-height: 100vh;
  overflow-x: hidden;
  -ms-overflow-style: none;
  scrollbar-width: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body::-webkit-scrollbar { display: none; }

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.018'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
}

::selection { background: var(--accent); color: var(--bg); }

.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 2rem 0 5rem;
  position: relative;
}

/* ---- HERO ---- */
.hero { padding: 7rem 0 5rem; position: relative; }

.hero-mark {
  font-family: var(--text);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 2rem;
  opacity: 0;
  transform: translateY(14px);
  animation: fadeDrop var(--dur-long) var(--ease-decelerate) 0.1s forwards;
}

.hero-name {
  font-family: var(--display);
  font-size: clamp(3.5rem, 10vw, 7rem);
  font-weight: 700;
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  margin-bottom: 2.5rem;
  opacity: 0;
  transform: translateY(18px);
  animation: fadeDrop var(--dur-long) var(--ease-decelerate) 0.2s forwards;
}

.hero-rule {
  width: 48px;
  height: 1px;
  background: var(--accent);
  margin-bottom: 2.5rem;
  opacity: 0;
  transform: scaleX(0);
  transform-origin: left;
  animation: lineGrow var(--dur-long) var(--ease-decelerate) 0.35s forwards;
}

.hero-tagline {
  font-family: var(--display);
  font-size: clamp(1.05rem, 2.5vw, 1.35rem);
  font-weight: 500;
  line-height: 1.6;
  color: var(--text-secondary);
  max-width: 30ch;
  margin-bottom: 2.5rem;
  opacity: 0;
  transform: translateY(14px);
  animation: fadeDrop var(--dur-long) var(--ease-decelerate) 0.45s forwards;
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  opacity: 0;
  transform: translateY(14px);
  animation: fadeDrop var(--dur-long) var(--ease-decelerate) 0.55s forwards;
}

.meta-dot {
  width: 5px;
  height: 5px;
  background: var(--accent);
  border-radius: 50%;
  flex-shrink: 0;
}

/* ---- SECTION ---- */
.section { padding: 4rem 0; position: relative; }
.section + .section { border-top: 1px solid var(--border); }

.section-label {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 2.5rem;
}

.section-index {
  font-family: var(--text);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.2em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.section-title {
  font-family: var(--text);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.section-line { flex: 1; height: 1px; background: var(--border); }

/* ---- LINK ROWS ---- */
.link-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1.5rem;
  padding: 0.9rem 0;
  text-decoration: none;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border);
  position: relative;
  transition: color var(--dur-mid) var(--ease-decelerate);
}

.link-row:first-child { border-top: 1px solid var(--border); }
.link-row:hover { color: var(--accent); }

.link-row-label {
  font-family: var(--display);
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  flex-shrink: 0;
}

.link-row-url {
  font-size: 11px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  transition: color var(--dur-mid) var(--ease-decelerate);
  text-align: right;
}

.link-row:hover .link-row-url { color: var(--accent-soft); }

.link-row::before {
  content: '';
  position: absolute;
  left: -1.5rem;
  top: 50%;
  width: 0;
  height: 1px;
  background: var(--accent);
  transform: translateY(-50%);
  transition: width var(--dur-mid) var(--ease-decelerate);
}

.link-row:hover::before { width: 1rem; }

/* ---- PROJECT ROWS ---- */
.proj-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1.5rem;
  padding: 1.1rem 0;
  text-decoration: none;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border);
  position: relative;
  transition: color var(--dur-mid) var(--ease-decelerate);
}

.proj-row:first-child { border-top: 1px solid var(--border); }
.proj-row:hover { color: var(--accent); }

.proj-row-label {
  font-family: var(--display);
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  flex-shrink: 0;
}

.proj-row-url {
  font-size: 11px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  transition: color var(--dur-mid) var(--ease-decelerate);
  text-align: right;
}

.proj-row:hover .proj-row-url { color: var(--accent-soft); }

.proj-row::before {
  content: '';
  position: absolute;
  left: -1.5rem;
  top: 50%;
  width: 0;
  height: 1px;
  background: var(--accent);
  transform: translateY(-50%);
  transition: width var(--dur-mid) var(--ease-decelerate);
}

.proj-row:hover::before { width: 1rem; }

/* ---- POSTS ---- */
.post-row {
  display: block;
  padding: 1rem 0;
  text-decoration: none;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border);
  transition: color var(--dur-mid) var(--ease-decelerate);
}

.post-row:first-child { border-top: 1px solid var(--border); }
.post-row:hover { color: var(--accent); }

/* 标题行：标题占左、日期与标签居右，底缘对齐 */
.post-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1.5rem;
  line-height: 1.5;
}

.post-title {
  font-family: var(--display);
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  flex: 1;
  min-width: 0;
}

/* 右侧信息组：日期 + 标签，居右、可换行 */
.post-aside {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  flex-shrink: 0;
  text-align: right;
}

.post-date {
  font-size: 11px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.06em;
  white-space: nowrap;
}

.post-tag {
  font-size: 9px;
  color: var(--accent);
  border: 1px solid var(--accent-soft);
  padding: 0.15rem 0.5rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.post-excerpt {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.02em;
  line-height: 1.6;
  margin-top: 0.3rem;
}

.posts-loading {
  padding: 2rem 0;
  text-align: center;
  color: var(--text-dim);
  font-size: 11px;
  letter-spacing: 0.1em;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

/* ---- FOOTER ---- */
.footer { padding: 1.5rem 0 4rem; margin-top: 0; }

.footer-line {
  height: 1px;
  background: var(--border-strong);
  margin-bottom: 1.5rem;
}

.footer-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; font-size: 11px; color: var(--text-dim); letter-spacing: 0.06em; }

.footer-inner a {
  color: var(--text-secondary);
  text-decoration: none;
  transition: color var(--dur-mid) var(--ease-decelerate);
}

.footer-inner a:hover { color: var(--accent); }

/* ---- REVEAL：减速停稳入场 ---- */
.reveal { opacity: 0; transition: opacity var(--dur-long) var(--ease-decelerate); }
.reveal.visible { opacity: 1; }

/* hidden 态 */
.reveal .section-index,
.reveal .section-title,
.reveal .section-line,
.reveal .proj-row,
.reveal .link-row,
.reveal .post-row,
.reveal .footer-line,
.reveal .footer-inner {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity var(--dur-long) var(--ease-decelerate), transform var(--dur-long) var(--ease-decelerate);
}

/* visible 态：栏目标题三元素先行错峰，然后 items 错峰，最后 footer */
.reveal.visible .section-index { opacity: 1; transform: none; transition-delay: 60ms; }
.reveal.visible .section-title { opacity: 1; transform: none; transition-delay: 150ms; }
.reveal.visible .section-line { opacity: 1; transform: none; transition-delay: 240ms; }

.reveal.visible .proj-row:nth-child(1),
.reveal.visible .link-row:nth-child(1),
.reveal.visible .post-row:nth-child(1) { opacity: 1; transform: none; transition-delay: 300ms; }

.reveal.visible .proj-row:nth-child(2),
.reveal.visible .link-row:nth-child(2),
.reveal.visible .post-row:nth-child(2) { opacity: 1; transform: none; transition-delay: 380ms; }

.reveal.visible .proj-row:nth-child(3),
.reveal.visible .link-row:nth-child(3),
.reveal.visible .post-row:nth-child(3) { opacity: 1; transform: none; transition-delay: 460ms; }

.reveal.visible .proj-row:nth-child(4),
.reveal.visible .link-row:nth-child(4),
.reveal.visible .post-row:nth-child(4) { opacity: 1; transform: none; transition-delay: 540ms; }

.reveal.visible .proj-row:nth-child(5),
.reveal.visible .link-row:nth-child(5),
.reveal.visible .post-row:nth-child(5) { opacity: 1; transform: none; transition-delay: 620ms; }

/* footer-line 加入 width 自画 */
.reveal .footer-line {
  width: 0;
  transform: none;
  transition: width var(--dur-long) var(--ease-decelerate), opacity var(--dur-long) var(--ease-decelerate);
}
.reveal.visible .footer-line {
  width: 100%;
  opacity: 1;
  transition-delay: 0ms;
}

.reveal.visible .footer-inner {
  opacity: 1;
  transform: none;
  transition-delay: 180ms;
}

/* ---- ANIMATIONS ---- */
@keyframes fadeDrop {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes lineGrow {
  from { opacity: 0; transform: scaleX(0); }
  to   { opacity: 1; transform: scaleX(1); }
}

/* ---- RESPONSIVE ---- */
@media (max-width: 768px) {
  .page { padding: 0 1.5rem 0 3.5rem; }
  .hero { padding: 5rem 0 3.5rem; }
  .post-head { flex-direction: column; gap: 0.3rem; align-items: flex-start; }
  .post-aside { text-align: left; }
}

@media (max-width: 480px) {
  .page { padding: 0 1rem 0 2.5rem; }
  .hero { padding: 3.5rem 0 2.5rem; }
  .link-row-label, .proj-row-label { font-size: 1.1rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    transition-delay: 0ms !important;
  }
  .reveal,
  .reveal .section-index,
  .reveal .section-title,
  .reveal .section-line,
  .reveal .proj-row,
  .reveal .link-row,
  .reveal .post-row,
  .reveal .footer-line,
  .reveal .footer-inner {
    opacity: 1 !important;
    transform: none !important;
    width: auto !important;
  }
  .reveal .footer-line { width: 100% !important; }
}
</style>
</head>

<script>
(function() {
  'use strict';

  function updateTime() {
    var now = new Date();
    var opts = { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hour12: false };
    var el = document.getElementById('current-time');
    if (el) el.textContent = now.toLocaleTimeString('zh-CN', opts);
  }
  updateTime();
  setInterval(updateTime, 30000);

  function updateFooterTime() {
    var now = new Date();
    var opts = { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false };
    var ftEl = document.getElementById('footer-time');
    if (ftEl) ftEl.textContent = 'UTC+8 ' + now.toLocaleString('zh-CN', opts);
  }
  updateFooterTime();
  setInterval(updateFooterTime, 30000);

  var reveals = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    reveals.forEach(function(el) { observer.observe(el); });
  } else {
    reveals.forEach(function(el) { el.classList.add('visible'); });
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function fetchPosts() {
    var container = document.getElementById('posts-list');
    try {
      var res = await fetch('https://blog.yuer6327.top/rss.xml');
      if (!res.ok) throw new Error('Network error');
      var xml = await res.text();
      var doc = new DOMParser().parseFromString(xml, 'application/xml');
      var items = doc.querySelectorAll('item');
      var posts = [];

      items.forEach(function(item) {
        var title = item.querySelector('title')?.textContent || '无标题';
        var link = item.querySelector('link')?.textContent || '#';
        var pubDate = item.querySelector('pubDate')?.textContent || '';
        var description = item.querySelector('description')?.textContent || '';
        var contentEl = item.getElementsByTagNameNS('http://purl.org/rss/1.0/modules/content/', 'encoded')[0];
        var content = contentEl ? (contentEl.textContent || '') : '';

        if (!content || content.trim().length === 0) return;

        var dateStr = '';
        if (pubDate) {
          var d = new Date(pubDate);
          dateStr = d.getFullYear() + '-' +
            String(d.getMonth() + 1).padStart(2, '0') + '-' +
            String(d.getDate()).padStart(2, '0');
        }

        var cats = item.querySelectorAll('category');
        var tag = cats.length > 0 ? cats[0].textContent : '';

        posts.push({ title: title, link: link, dateStr: dateStr, description: description, tag: tag });
      });

      var display = posts.slice(0, 8);
      container.innerHTML = '';

      if (display.length === 0) {
        container.innerHTML = '<div class="posts-loading">暂无文章</div>';
        return;
      }

      display.forEach(function(post, i) {
        var el = document.createElement('a');
        el.href = post.link;
        el.target = '_blank';
        el.rel = 'noopener';
        el.className = 'post-row';

        var tagHtml = post.tag
          ? '<span class="post-tag">' + esc(post.tag) + '</span>'
          : '';

        el.innerHTML =
          '<span class="post-head">' +
            '<span class="post-title">' + esc(post.title) + '</span>' +
            '<span class="post-aside">' +
              '<span class="post-date">' + esc(post.dateStr) + '</span>' +
              tagHtml +
            '</span>' +
          '</span>' +
          '<span class="post-excerpt">' + esc(post.description) + '</span>';

        container.appendChild(el);
      });

    } catch (err) {
      container.innerHTML = '<div class="posts-loading">加载失败，请稍后重试</div>';
      console.error('RSS fetch error:', err);
    }
  }

  fetchPosts();
})();
</script>
